appId: com.mkttool.browser
productName: MKT Browser
executableName: MKTBrowser
# Pinned to the version in package.json devDependencies so electron-builder
# does not need to introspect node_modules. Bump in sync when upgrading.
electronVersion: 42.8.1
directories:
  output: release
  buildResources: ../../build
afterPack: scripts/edit-windows-executable.cjs
npmRebuild: false

files:
  - "out/**/*"
  - "package.json"
  - "!**/*.map"
  - "!node_modules/@mktbrowser/**"

# Override package.json metadata in the packaged app. We strip the
# @mktbrowser/* workspace deps because electron-vite has already inlined
# them into out/main/index.js — there's no runtime need for the
# symlinked dirs in node_modules/@mktbrowser/. Without this override,
# electron-builder follows the symlinks to packages/<x>/package.json,
# which is outside apps/desktop, and refuses to package
# ("package.json must be under apps/desktop").
extraMetadata:
  author: Techieslab
  description: Internal MKTTool browser profile runtime
  dependencies:
    "@modelcontextprotocol/sdk": "^1.0.4"
    better-sqlite3: "^12.11.1"
    chrome-remote-interface: "^0.33.3"
    cloakbrowser: "0.5.10"
    framer-motion: "^12.0.0"
    https-proxy-agent: "^9.0.0"
    lucide-react: "^0.469.0"
    playwright-core: "1.62.0"
    proxy-chain: "^2.7.1"
    socks: "^2.8.3"
    socks-proxy-agent: "^10.0.0"
    uuid: "^11.0.5"
    yauzl: "3.4.0"

# Native modules (better-sqlite3 has a .node C++ binding) cannot be
# loaded from inside an asar archive — Node's require() can't dlopen
# a file that doesn't exist on the real filesystem. Unpack them so
# the .node files end up at .../app.asar.unpacked/ on disk. Pattern
# covers any future native deps too.
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**/*"

# Bundled first-party companion extension (injects the "Add to MKT Browser"
# button on Web Store pages). Copied verbatim into <resources>/companion so the
# driver can pass it to --load-extension for every profile.
extraResources:
  - from: resources/companion
    to: companion

# Stable local artifact names. W02 intentionally has no publish provider or
# application update channel; internal release delivery belongs to W04.
mac:
  category: public.app-category.developer-tools
  icon: ../../build/icon.icns
  # NO hardcoded arch here on purpose. The release workflow builds each macOS
  # arch on a runner of that arch and passes the arch via the CLI
  # (`electron-builder --mac --x64` / `--arm64`). If we listed `arch: [x64, arm64]`
  # here, the config would win over the CLI flag and EACH runner would build
  # BOTH arches into one shared node_modules — the second arch's @electron/rebuild
  # overwrites the native better-sqlite3 .node, and the first arch's package
  # (built concurrently) ships the wrong-arch .node. That shipped an arm64
  # better_sqlite3.node inside the x64 app and crashed every Intel Mac on launch
  # (issue #19). Leaving arch unset makes the CLI flag select exactly one arch
  # per runner, so the native module always matches the package.
  target:
    - dmg
    - zip
  artifactName: "MKTBrowser-mac-${arch}.${ext}"
  # Open-source unsigned build: skip Apple notarization (would need a
  # $99/yr Developer ID). We use ad-hoc signing (identity "-") so the
  # binary has at least *some* signature — without it, macOS Sequoia
  # shows the scary "is damaged" Gatekeeper dialog with no override.
  # With ad-hoc sig the user can right-click → Open, or run
  # Use xattr on /Applications/MKT Browser.app to strip the quarantine bit.
  # Both paths are documented in the release notes.
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  identity: "-"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "MKTBrowser-win-${arch}.${ext}"
  icon: ../../build/icon.png
  # Resource editing is handled by the afterPack hook. electron-builder's
  # bundled winCodeSign archive requires Windows symlink privileges even when
  # no certificate is configured, which breaks ordinary non-admin W01 builds.
  signAndEditExecutable: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "MKTBrowser-linux-${arch}.${ext}"
  icon: ../../build/icons

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  uninstallDisplayName: "MKT Browser"
