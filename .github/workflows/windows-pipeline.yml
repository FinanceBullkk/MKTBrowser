name: Windows Diagnostics

# Optional hosted diagnostics for the internal Windows runtime. Release readiness is decided
# locally per the workspace release gate; this pipeline only re-runs the local check chain on a
# clean hosted runner so failures are visible outside the dev machine.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin Node.js 22 executable
        id: node22
        shell: pwsh
        run: ./.github/scripts/prepare-windows-node22.ps1

      - name: Enable Corepack
        shell: pwsh
        run: |
          & "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" enable
          & "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" prepare yarn@4.5.0 --activate

      - name: Prepare Windows native dependencies
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native-dependencies.ps1 -NodeExecutable "${{ steps.node22.outputs.node22_exe }}" -NodeSha256 "${{ steps.node22.outputs.node22_sha256 }}"

      - name: Install dependencies
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn install --immutable'

      - name: Audit production dependencies
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn audit:production'

      - name: Node.js build guard
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn verify:node'

      - name: Lint
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn lint'

      - name: Installer and runtime guard suites
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn test:installer'

      - name: Critical coverage contract
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn test:critical-coverage'

      - name: Typecheck
        shell: pwsh
        run: '& "${{ steps.node22.outputs.node22_exe }}" "${{ steps.node22.outputs.corepack22_entrypoint }}" yarn typecheck'
