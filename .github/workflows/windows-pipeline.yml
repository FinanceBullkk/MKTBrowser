name: Windows Pipeline

# The Windows build, package, and packaged-contract verification, defined once and called by both
# the push workflow and the pull-request gate workflow.
#
# It lives in its own file for a reason that is easy to get wrong. A job carrying the required check
# name cannot simply be disabled on push with an `if:` condition, because GitHub still publishes a
# check run for the skipped job, and a skipped required check counts as satisfied. A push would then
# report the required name and a failing pipeline could merge. Keeping the gate in the pull-request
# workflow means push never produces that name at all.

on:
  workflow_call:
    inputs:
      contract_iterations:
        description: "Packaged runtime contract cold-launch iterations"
        required: false
        type: string
        default: "5"
      expected_engine_version:
        description: "Engine version every run of a stability streak must report (blank records only)"
        required: false
        type: string
        default: ""
      build_installer:
        description: "Also build the combined Windows installer (Phase 4 only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit production dependencies
        run: yarn audit:production

      - name: Node.js build guard
        run: yarn verify:node

      - name: Workspace quality contract
        run: yarn verify:workspace-quality

      - name: Lint
        run: yarn lint

      - name: Installer and runtime guard suites
        run: yarn test:installer

      # Critical-path coverage, not a whole-repository percentage. See
      # scripts/critical-coverage-contract.cjs for which modules are protected and why.
      - name: Critical coverage contract
        run: yarn test:critical-coverage

      - name: Typecheck
        run: yarn typecheck

  package:
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Windows directory package once
        run: yarn workspace @mktbrowser/desktop build

      - name: Archive and hash directory package
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP "mktbrowser-package"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $archive = Join-Path $artifactRoot "mktbrowser-win-unpacked.zip"
          Compress-Archive -Path "apps/desktop/release/win-unpacked/*" -DestinationPath $archive -CompressionLevel Optimal
          $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            sourceSha = $env:GITHUB_SHA
            archive = "mktbrowser-win-unpacked.zip"
            sha256 = $sha256
            node = (node --version)
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactRoot "artifact-manifest.json") -Encoding utf8NoBOM

      - name: Upload exact directory package
        uses: actions/upload-artifact@v4
        with:
          name: mktbrowser-win-unpacked
          path: ${{ runner.temp }}/mktbrowser-package/*
          if-no-files-found: error
          retention-days: 7

  packaged-contract:
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies without rebuilding the package
        run: yarn install --immutable

      - name: Download exact directory package
        uses: actions/download-artifact@v5
        with:
          name: mktbrowser-win-unpacked
          path: ${{ runner.temp }}/mktbrowser-artifact

      - name: Verify artifact manifest and extract
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP "mktbrowser-artifact"
          $manifestPath = Join-Path $artifactRoot "artifact-manifest.json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.sourceSha -ne $env:GITHUB_SHA) { throw "Artifact source SHA does not match the checked-out merge tree." }
          $archive = Join-Path $artifactRoot $manifest.archive
          $actualSha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $manifest.sha256) { throw "Downloaded directory package hash does not match its manifest." }
          $unpacked = Join-Path $env:RUNNER_TEMP "mktbrowser-contract-package"
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          $evidence = Join-Path $env:RUNNER_TEMP "mktbrowser-contract-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MKT_BROWSER_EXECUTABLE=$(Join-Path $unpacked 'MKTBrowser.exe')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MKT_BROWSER_ARTIFACT_MANIFEST=$manifestPath"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MKT_BROWSER_TIMINGS_OUTPUT=$(Join-Path $evidence 'timings.json')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MKT_BROWSER_DIAGNOSTICS_DIR=$(Join-Path $evidence 'diagnostics')"

      # The iteration count reaches the verifier through the environment, never through string
      # interpolation into the command line, so a dispatch input cannot become shell syntax.
      # The verifier itself rejects anything that is not an integer from 1 to 100.
      - name: Verify packaged runtime contract repeatedly
        env:
          MKT_CONTRACT_ITERATIONS: ${{ inputs.contract_iterations }}
          # Blank on push and pull request, so ordinary runs still record whatever Chrome the image
          # ships. A stability streak declares one version and any drift fails that run.
          MKT_BROWSER_EXPECTED_ENGINE_VERSION: ${{ inputs.expected_engine_version }}
        run: node scripts/verify-packaged-runtime-contract.cjs --repeat "$env:MKT_CONTRACT_ITERATIONS"

      - name: Upload packaged contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-contract-evidence
          path: |
            ${{ runner.temp }}/mktbrowser-contract-evidence/**
            ${{ runner.temp }}/mktbrowser-artifact/artifact-manifest.json
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    # Phase 4 builds exactly one installer from a frozen tree. Stability dispatch runs must not
    # produce extra unsigned installers that could be mistaken for the release artifact.
    if: inputs.build_installer
    needs: packaged-contract
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build combined Windows installer
        env:
          MKTTOOL_RELEASE_TOKEN: ${{ secrets.MKTTOOL_RELEASE_TOKEN }}
          MKT_BROWSER_ENGINE_RELEASE_FILE: ${{ github.workspace }}/apps/desktop/windows-engine-release.json
        run: yarn workspace @mktbrowser/desktop build:win

      - name: Upload combined Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mktbrowser-windows-installer
          path: apps/desktop/release/installer/*.exe
          if-no-files-found: error
