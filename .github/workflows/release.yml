name: Windows Technical Build

# Optional manual diagnostics; local validation and clean-VM acceptance gate releases.
on:
  workflow_dispatch:
    inputs:
      contract_iterations:
        description: "Packaged runtime contract cold-launch iterations"
        required: false
        default: "20"
      expected_engine_version:
        description: "Packaged-verifier engine version to require"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-pipeline.yml
    with:
      contract_iterations: ${{ inputs.contract_iterations }}
      expected_engine_version: ${{ inputs.expected_engine_version }}
    secrets:
      MKTTOOL_DEPLOY_KEY: ${{ secrets.MKTTOOL_DEPLOY_KEY }}
