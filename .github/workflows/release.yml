name: Windows W02 Build

# W02 has no release or publishing channel. Run this workflow manually to
# validate the isolated Windows directory package without creating a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Product identity tests
        run: yarn workspace @mktbrowser/desktop test:w02

      - name: Typecheck
        run: yarn typecheck

      - name: Build Windows directory package
        run: yarn workspace @mktbrowser/desktop build
