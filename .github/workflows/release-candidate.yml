name: Release Candidate

# Phase 4. Produces exactly one attested installer from a frozen tree.
#
# Manual only, and deliberately awkward to start: the operator has to type the commit they intend to
# freeze, and the run refuses to proceed if the checked-out commit is a different one. A release
# built from "whatever the branch happened to be" is the failure this guards against, and it is not
# visible afterwards in the artifact.
#
# The tree is built twice in separate self-hosted runner jobs and the payloads are compared. V1
# ships unsigned, so nothing in the file identifies its publisher: the reproducibility comparison
# and the published SHA-256 are what stand in for a signature, and neither is optional. Runner image
# hygiene is an external prerequisite; the workflow provides clean checkouts, not clean machines.
#
# The installer that gets attested is the one build A produced. It is uploaded once and reused, never
# rebuilt between verification and attestation, because a rebuild produces a different file than the
# one that was checked.

on:
  workflow_dispatch:
    inputs:
      confirm_commit:
        description: "Commit SHA being frozen (at least 8 characters, must match the checked-out commit)"
        required: true
      candidate_id:
        description: "Immutable release candidate ID from the release manifest"
        required: true

permissions:
  contents: read

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64, mktbrowser]
    steps:
      - name: Refuse to build a commit other than the one named
        env:
          CONFIRM: ${{ inputs.confirm_commit }}
        run: |
          if [ "${#CONFIRM}" -lt 8 ]; then
            echo "::error::Name at least 8 characters of the commit being frozen."
            exit 1
          fi
          case "$GITHUB_SHA" in
            "$CONFIRM"*) echo "Frozen commit confirmed: $GITHUB_SHA" ;;
            *)
              echo "::error::This run checked out $GITHUB_SHA, which does not start with $CONFIRM."
              exit 1
              ;;
          esac

  build:
    needs: freeze
    runs-on: [self-hosted, Windows, X64, mktbrowser]
    strategy:
      # Two independent builds of one tree. `fail-fast: false` so a failure in one still leaves the
      # other's evidence to compare against when diagnosing.
      fail-fast: false
      matrix:
        attempt: [a, b]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Prepare Windows native dependencies
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native-dependencies.ps1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit production dependencies
        run: yarn audit:production

      - name: Build the combined Windows installer
        env:
          MKTTOOL_RELEASE_TOKEN: ${{ secrets.MKTTOOL_RELEASE_TOKEN }}
          MKT_BROWSER_ENGINE_RELEASE_FILE: ${{ github.workspace }}/apps/desktop/windows-engine-release.json
        run: yarn workspace @mktbrowser/desktop build:win

      # The staged tree is what the installer delivers. Comparing it rather than the compressed
      # installer keeps the comparison on the payload, where a difference means something.
      - name: Emit normalized payload manifest
        run: node scripts/normalized-payload-manifest.cjs --directory apps/desktop/release/installer/win-unpacked --output payload-manifest-${{ matrix.attempt }}.json

      - name: Upload payload manifest
        uses: actions/upload-artifact@v4
        with:
          name: payload-manifest-${{ matrix.attempt }}
          path: payload-manifest-${{ matrix.attempt }}.json
          if-no-files-found: error
          retention-days: 30

      # Only build A's installer is retained. Build B exists to be compared with, not to be shipped;
      # keeping both would leave two candidate files that no signature can tell apart.
      - name: Upload candidate installer
        if: matrix.attempt == 'a'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-installer
          path: apps/desktop/release/installer/*.exe
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: build
    runs-on: [self-hosted, Linux, X64, mktbrowser]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # The action probes for a package-manager cache using the bundled Yarn 1, which refuses to
          # run against a project pinned to yarn@4.5.0. Left on, the step fails before the job runs.
          package-manager-cache: false

      - name: Download both payload manifests
        uses: actions/download-artifact@v5
        with:
          pattern: payload-manifest-*
          merge-multiple: true
          path: ${{ runner.temp }}/manifests

      - name: Require two independent builds to produce the same payload
        run: node scripts/normalized-payload-manifest.cjs --compare "$RUNNER_TEMP/manifests/payload-manifest-a.json" "$RUNNER_TEMP/manifests/payload-manifest-b.json"
        shell: bash

  attest:
    needs: compare
    runs-on: [self-hosted, Linux, X64, mktbrowser]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # The action probes for a package-manager cache using the bundled Yarn 1, which refuses to
          # run against a project pinned to yarn@4.5.0. Left on, the step fails before the job runs.
          package-manager-cache: false

      # Downloaded outside the checkout on purpose. The provenance step refuses to attest a dirty
      # working tree, and an artifact unpacked into the repository makes it dirty.
      - name: Download the verified candidate installer
        uses: actions/download-artifact@v5
        with:
          name: candidate-installer
          path: ${{ runner.temp }}/candidate

      - name: Download payload manifest
        uses: actions/download-artifact@v5
        with:
          name: payload-manifest-a
          path: ${{ runner.temp }}/manifests

      - name: Emit release provenance for the verified artifact
        env:
          MKT_RELEASE_CANDIDATE_ID: ${{ inputs.candidate_id }}
        shell: bash
        run: |
          if [ -z "${MKT_RELEASE_CANDIDATE_ID}" ]; then
            echo "::error::candidate_id is required; refusing an unattached provenance record."
            exit 1
          fi
          installer=$(find "$RUNNER_TEMP/candidate" -name '*.exe' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::No installer found in the downloaded candidate artifact."
            exit 1
          fi
          node scripts/emit-release-provenance.cjs \
            --installer "$installer" \
            --payload-manifest "$RUNNER_TEMP/manifests/payload-manifest-a.json" \
            --engine-release "$GITHUB_WORKSPACE/apps/desktop/windows-engine-release.json" \
            --candidate-id "$MKT_RELEASE_CANDIDATE_ID" \
            --dependency-audit "yarn npm audit --environment production --severity high passed in both builds" \
            --output release-provenance.json
          cat release-provenance.json

      - name: Upload release provenance
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 90

  # Phase 4 asks whether the candidate installs and uninstalls cleanly on a machine that has never
  # had the product. This job therefore requires a disposable self-hosted Windows VM restored to a
  # clean snapshot before the run. GitHub Actions cleans the checkout, but it cannot make a reused
  # host equivalent to a fresh machine.
  #
  # What this does not answer, stated so the green tick is not read as more than it is: no reboot, no
  # power loss, no human at the keyboard, no real proxy, and no licence seat. Those are the Phase 5
  # gates and they need hardware and an operator.
  installed-contract:
    needs: attest
    runs-on: [self-hosted, Windows, X64, mktbrowser]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare pinned packaged verifier engine
        shell: pwsh
        run: ./.github/scripts/prepare-windows-packaged-verifier.ps1

      - name: Download the attested candidate installer
        uses: actions/download-artifact@v5
        with:
          name: candidate-installer
          path: ${{ runner.temp }}/candidate

      - name: Install silently, the way an operator's one download behaves
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "$env:RUNNER_TEMP/candidate" -Filter *.exe -Recurse |
            Select-Object -First 1
          if (-not $installer) { throw "No installer found in the attested candidate artifact." }
          Write-Host "Installing $($installer.Name)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }

      - name: Locate the installed application
        shell: pwsh
        run: |
          # Per-user install, so the application lands under the local profile rather than Program
          # Files. Discovered rather than hardcoded: a changed product name should fail loudly here
          # instead of silently verifying a path that no longer exists.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            (Join-Path $env:LOCALAPPDATA 'Programs\MKT Browser')
          ) | Where-Object { Test-Path $_ }
          $exe = $null
          foreach ($root in $candidates) {
            $exe = Get-ChildItem -Path $root -Filter 'MKTBrowser.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) { throw "Installed MKTBrowser.exe was not found under the local profile." }
          Write-Host "Installed at $($exe.FullName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MKT_BROWSER_EXECUTABLE=$($exe.FullName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MKT_BROWSER_INSTALL_DIR=$($exe.Directory.FullName)"

      - name: Verify the runtime contract against the installed application
        env:
          MKT_BROWSER_TIMINGS_OUTPUT: ${{ runner.temp }}/installed-timings.json
          MKT_BROWSER_DIAGNOSTICS_DIR: ${{ runner.temp }}/installed-diagnostics
        run: node scripts/verify-packaged-runtime-contract.cjs --repeat 2

      - name: Uninstall, and require the application directory to be gone
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem -Path $env:MKT_BROWSER_INSTALL_DIR -Filter 'Uninstall*.exe' |
            Select-Object -First 1
          if (-not $uninstaller) { throw "No uninstaller beside the installed application." }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)." }
          # The uninstaller returns before NSIS finishes removing its own directory.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $env:MKT_BROWSER_INSTALL_DIR) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path $env:MKT_BROWSER_INSTALL_DIR) {
            $left = Get-ChildItem -Path $env:MKT_BROWSER_INSTALL_DIR -Recurse | Select-Object -First 20
            throw "Uninstall left files behind:`n$($left.FullName -join "`n")"
          }
          Write-Host "Uninstall removed the application directory."

      - name: Upload installed-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-contract-evidence
          path: |
            ${{ runner.temp }}/installed-timings.json
            ${{ runner.temp }}/installed-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
